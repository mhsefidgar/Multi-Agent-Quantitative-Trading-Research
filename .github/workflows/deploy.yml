name: quant-engine-ci-cd

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - name: Factor baseline gate
        run: pytest -q tests/test_factor_baseline.py

  terraform:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  deploy:
    needs: terraform
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build and push immutable image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --pull -t "$ECR_REPOSITORY:${GITHUB_SHA}" .
          docker push "$ECR_REPOSITORY:${GITHUB_SHA}"
      - name: Register task definition with release image
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
          IMAGE: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$SERVICE" --query taskDefinition > task-definition.json
          jq --arg image "$IMAGE" '.containerDefinitions[0].image=$image | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' task-definition.json > task-definition.release.json
          aws ecs register-task-definition --cli-input-json file://task-definition.release.json > registered.json
          REVISION=$(jq -r '.taskDefinition.taskDefinitionArn' registered.json)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$REVISION"
      - name: Wait for stable deployment
        run: aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}"
