[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-quantitative-trading-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<1.0",
  "mcp>=1.0,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "httpx>=0.27,<1",
  "structlog>=24,<26",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp>=1.27,<2",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2", "pandas-stubs>=2.2"]

[project.scripts]
quant-mcp = "src.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
